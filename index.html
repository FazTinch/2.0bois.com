				function loadInscription(url) {
				  return new Promise(function(resolve) {
					var s = document.createElement('script');
					s.src = url;
					s.onload  = resolve;
					s.onerror = function() {
					  console.warn('inscription failed to load:', url);
					  resolve(); // fail gracefully so the rest of the page still runs
					};
					document.head.appendChild(s);
				  });
				}

				function base64ToArrayBuffer(base64) {
				  const binaryString = atob(base64);
				  const len = binaryString.length;
				  const bytes = new Uint8Array(len);
				  for (let i = 0; i < len; i++) {
					bytes[i] = binaryString.charCodeAt(i);
				  }
				  return bytes.buffer;
				}

				function loadScript(jsContent) {
				  const script = document.createElement('script');
				  script.text = jsContent;
				  document.body.appendChild(script);
				}

				async function inflateContent() {
				  try {
					// Load pako + all inscription dependencies in parallel
					const [{ default: pako }] = await Promise.all([
					  import('https://ordinals.com/content/fba6f95fb1152db43304a27dce8cb8c65509eba6ab0b6958cedeb33e5f443077i0'),
					  ...inscriptions.map(loadInscription),

					const compressedData = base64ToArrayBuffer(base64GzipPackage);

					const decompressed = pako.inflate(compressedData, {
					  to: 'string'

					document.getElementById('content').innerHTML = decompressed;

					const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/g;
					let match;
					while ((match = scriptRegex.exec(decompressed)) !== null) {
					  loadScript(match[1]);
					}

				  } catch (err) {
					console.error('Error decompressing or loading:', err);
				  }
				}
