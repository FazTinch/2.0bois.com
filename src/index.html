<html lang="en">

		<title>The 2.0 BOIS</title>
		<meta name="description" content="3 x Fomojis 2.0 Wizards Hat BOIS serve only one purpose — entertain." />

		<!-- 2.0 BOIS favicon -->
		<link rel="icon" href="https://ordinals.com/content/5d6f78ba1451ea20490e5609eaa9bc7e3dea9a1b2bd40d69d5f936fd25307579i0">

	</head>

	<body id="content">

		<script type="module">
			import pako from 'https://ordinals.com/content/fba6f95fb1152db43304a27dce8cb8c65509eba6ab0b6958cedeb33e5f443077i0';

			const base64GzipPackage = '__BLOB__';

			// JS libraries inscribed on-chain that must be loaded before blob scripts run.
			// Each entry becomes a global (e.g. inlineSVG) once its inscription executes.
			const inscriptions = [
				'https://ordinals.com/content/44551f1d25e6e6e655ddff3e83874c3ab34285b097fefbb13111b11edd71d18ai0', // inline-svg.js
			];

			function loadInscription(url) {
			  return new Promise(function(resolve) {
				var s = document.createElement('script');
				s.src = url;
				s.onload  = resolve;
				s.onerror = function() {
				  console.warn('inscription failed to load:', url);
				  resolve(); // fail gracefully so the rest of the page still runs
				};
				document.head.appendChild(s);
			  });
			}

			function base64ToArrayBuffer(base64) {
			  const binaryString = atob(base64);
			  const len = binaryString.length;
			  const bytes = new Uint8Array(len);
			  for (let i = 0; i < len; i++) {
				bytes[i] = binaryString.charCodeAt(i);
			  }
			  return bytes.buffer;
			}

			function loadScript(jsContent) {
			  const script = document.createElement('script');
			  script.text = jsContent;
			  document.body.appendChild(script);
			}

			async function inflateContent() {
			  try {
				// Guarantee all inscription dependencies are executed before blob scripts run
				await Promise.all(inscriptions.map(loadInscription));

				const compressedData = base64ToArrayBuffer(base64GzipPackage);

				const decompressed = pako.inflate(compressedData, {
				  to: 'string'
				});

				document.getElementById('content').innerHTML = decompressed;

				const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/g;
				let match;
				while ((match = scriptRegex.exec(decompressed)) !== null) {
				  loadScript(match[1]);
				}

			  } catch (err) {
				console.error('Error decompressing or loading:', err);
			  }
			}

			document.addEventListener('DOMContentLoaded', inflateContent);
		</script>

	</body>

</html>
